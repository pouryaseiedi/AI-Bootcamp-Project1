            font-size: 1.1em;

    <script>
        // Load saved notes from localStorage
        function loadNotes() {
            // Load description boxes
            document.querySelectorAll('.description-box').forEach(box => {
                const key = box.dataset.img;
                const saved = localStorage.getItem('note_' + key);
                if (saved) box.innerHTML = saved;
            });
            // Load title boxes
            document.querySelectorAll('.title-box').forEach(box => {
                const key = box.dataset.img;
                const saved = localStorage.getItem('title_' + key);
                if (saved) box.innerHTML = saved;
            });
        }
        
        function saveNote(key) {
            const box = document.querySelector('.description-box[data-img="' + key + '"]');
            if (box) {
                localStorage.setItem('note_' + key, box.innerHTML);
            }
            
            // Save title separately
            const titleBox = document.querySelector('.title-box[data-img="' + key + '_title"]');
            if (titleBox) {
                localStorage.setItem('title_' + key + '_title', titleBox.innerHTML);
            }
            alert('توضیح و نام ذخیره شد: ' + key);
        }
        
        // Auto-save on blur
        document.querySelectorAll('.description-box').forEach(box => {
            box.addEventListener('blur', function() {
                localStorage.setItem('note_' + this.dataset.img, this.innerHTML);
            });
        });
        
        document.querySelectorAll('.title-box').forEach(box => {
            box.addEventListener('blur', function() {
                localStorage.setItem('title_' + this.dataset.img, this.innerHTML);
            });
        });
        
        loadNotes();
    </script>
